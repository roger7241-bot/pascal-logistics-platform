# ==============================================================================
# Render Blueprint — Pascal Logistics Fractional Logistics Platform
# https://render.com/docs/blueprint-spec
#
# Deploys three services from this monorepo:
#   1. pascal-logistics-api      — Express + WebSocket backend (/server)
#   2. pascal-logistics-portal   — Vite React static site (/client)
#   3. pascal-legacy-carrier-poll — Cron job running the Playwright scraper
#
# CLIENT_ORIGIN_URL and VITE_API_BASE_URL cross-reference each service's
# public URL. Render's Blueprint spec has no variable interpolation and no
# "public URL" property for fromService (hostport is private-network-only),
# so these are intentionally `sync: false` — set them once in the Render
# dashboard after the first deploy, to each service's actual onrender.com
# URL (or custom domain). Every other secret below follows the same pattern.
# ==============================================================================

services:
  - type: web
    name: pascal-logistics-api
    runtime: node
    plan: starter
    region: oregon
    rootDir: server
    buildCommand: npm install && npx playwright install chromium && npm run build
    preDeployCommand: npm run migrate
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 20.14.0
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: pascal-logistics-db
          property: connectionString
      # Render's Blueprint spec does not support variable interpolation, and
      # the `hostport` property is private-network-only (no https://,
      # unreachable from a browser) — so this can't be auto-derived here.
      # After the first deploy, set this in the Render dashboard to the
      # portal's actual public URL — by default
      # https://pascal-logistics-portal.onrender.com, or your custom domain.
      - key: CLIENT_ORIGIN_URL
        sync: false
      # Placeholders — real values set in the Render dashboard, never
      # committed to source control.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: AGENTMAIL_API_KEY
        sync: false
      - key: TOMTOM_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
        generateValue: true
      - key: PUBLIC_API_BASE_URL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: us-west-2
      - key: DOCUMENT_VAULT_BUCKET
        sync: false

  - type: web
    name: pascal-logistics-portal
    runtime: static
    plan: starter
    # `region` does not apply to static sites — omitted per the Blueprint spec.
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      # Same interpolation limitation as CLIENT_ORIGIN_URL above — set this
      # after first deploy to the API's actual public URL, by default
      # https://pascal-logistics-api.onrender.com.
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      # SPA rewrite — every unmatched path serves index.html so client-side
      # routing works on hard refresh / deep links.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff

  - type: cron
    name: pascal-legacy-carrier-poll
    runtime: node
    plan: starter
    region: oregon
    rootDir: server
    # 3x daily: 07:00, 13:00, 19:00 UTC — matches the Tier 1 scraper's
    # documented polling schedule.
    schedule: "0 7,13,19 * * *"
    buildCommand: npm install && npx playwright install chromium && npm run build
    startCommand: npm run cron:poll-legacy-carriers
    envVars:
      - key: NODE_VERSION
        value: 20.14.0
      - key: DATABASE_URL
        fromDatabase:
          name: pascal-logistics-db
          property: connectionString
      - key: AGENTMAIL_API_KEY
        sync: false

  - type: cron
    name: pascal-morning-brief
    runtime: node
    plan: starter
    region: oregon
    rootDir: server
    # 07:00 America/Los_Angeles = 14:00 UTC (15:00 during PDT — Render cron
    # schedules run in UTC with no DST awareness, so this drifts by an hour
    # for half the year; acceptable for a daily digest, flagged here rather
    # than silently wrong).
    schedule: "0 14 * * *"
    buildCommand: npm install && npm run build
    startCommand: npm run cron:morning-brief
    envVars:
      - key: NODE_VERSION
        value: 20.14.0
      - key: DATABASE_URL
        fromDatabase:
          name: pascal-logistics-db
          property: connectionString

databases:
  - name: pascal-logistics-db
    plan: basic-256mb
    region: oregon
